
name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build -- --base-href /Nawara-s-Showroom/

      - name: Prepare GitHub Pages
        run: |
          INDEX_FILE=$(find dist -name index.html -type f | head -n 1)

          if [ -z "$INDEX_FILE" ]; then
            echo "Erreur : index.html introuvable dans dist"
            find dist -maxdepth 4 -type f || true
            exit 1
          fi

          OUTPUT_DIR=$(dirname "$INDEX_FILE")
          cp "$INDEX_FILE" "$OUTPUT_DIR/404.html"
          echo "Dossier à publier : $OUTPUT_DIR"

          echo "$OUTPUT_DIR" >> "$GITHUB_OUTPUT"
        id: prepare

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.prepare.outputs.output_dir }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
